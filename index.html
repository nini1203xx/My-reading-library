
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reading Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📚 My Reading Library</h1>
        <p>Thư viện truyện của tôi</p>
    </header>

    <main>
        <div class="toolbar">
            <input type="text" placeholder="🔍 Tìm truyện...">
            <button>+ Thêm truyện</button>
        </div>

        <section class="book-list">

            <div class="book-card">
                <div class="cover">📖</div>
                <h3>One Piece</h3>
                <p>⭐ 5.0</p>
                <span>📖 Đang đọc</span>
            </div>

            <div class="book-card">
                <div class="cover">📖</div>
                <h3>Solo Leveling</h3>
                <p>⭐ 4.5</p>
                <span>✅ Đã đọc</span>
            </div>

            <div class="book-card">
                <div class="cover">📖</div>
                <h3>Omniscient Reader</h3>
                <p>⭐ 5.0</p>
                <span>📖 Đang đọc</span>
            </div>

        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
